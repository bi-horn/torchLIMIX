project: "TorchLIMIX" 
test_type: "any_vs_common"
analysis: "gwas" # Choose between gwas, vardec (variance decomposition) and prediction
pheno_idx: 0
verbose: True
rank: 4

output_directory: "torchlimix/torchLIMIX_results"

original_L_init: False
num_threads: 8
mean_type: "Constant"

keep_latest_outputs: 10

data_param:
  dset: "thaliana_horton" 
  train_pct: 1.0
  val_pct: 0.0
  data_path_config: "${PACKAGE_ROOT}/torchlimix/configs/config.json"
  batch_size: 0
  seed: 42 
  num_workers: 0
  simulated: False
  rep_idx: 0
  num_samples: 250
  eta: 0.5
  use_heterogeneity: False
  corr_bounds: 0
  vardec_scenario: 3
  num_tasks: 4
  ncausal: 1
  reference_trait: 0
  transformation_method: "int"

  # Covariate handling (mutually exclusive):
  regress_out_covariates: False # Regress covariates before analysis (default: True if cov_path provided)
  include_covariates_in_model: False # Include covariates in M matrix (alternative approach)
  
  # Batch and covariate correction:
  regress_out_batch_effects: False  # Auto-enabled if batch_path is provided
  
gpus: 1 # 1 for "cuda" or 0 for "cpu"
num_devices: 1


# python torchlimix --config torchlimix/configs/hyperparameters.yaml

# python -m torchlimix.cli --config torchlimix/configs/hyperparameters.yaml